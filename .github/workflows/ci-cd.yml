name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/loghmarisyrine/task-manager-devsecops

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations,venv

      - name: Run tests
        run: python manage.py test

      # --- Étape 05 (DevSecOps) à ajouter ici, avant le build ---
      # - name: SonarQube Scan
      #   uses: sonarsource/sonarqube-scan-action@v2
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #
      # - name: Gitleaks (détection de secrets)
      #   uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest

      # --- Étape 05 (DevSecOps) : scan de l'image avant déploiement ---
      # - name: Trivy scan de l'image
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      #     severity: CRITICAL,HIGH
      #     exit-code: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/taskmanager
            docker compose pull
            docker compose up -d

      # --- Étape 05 (DevSecOps) : scan dynamique post-déploiement ---
      # - name: OWASP ZAP baseline scan
      #   uses: zaproxy/action-baseline@v0.12.0
      #   with:
      #     target: "https://staging.example.com"
